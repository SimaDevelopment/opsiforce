apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsiforce-runtime-proxies.fullname" . }}-secret
type: Opaque
stringData:
  PROXY_CONTROL_TOKEN: {{ required "config.proxyControlToken is required; the backend and the runtime proxies must share it (generate one with: openssl rand -hex 32)" .Values.config.proxyControlToken | quote }}
  APP_AUTH_FORWARDING_SIGNING_KEY: {{ .Values.config.appAuthForwardingSigningKey | quote }}
