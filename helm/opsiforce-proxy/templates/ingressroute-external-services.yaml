{{- if and .Values.ingressRoute.enabled .Values.externalServiceProxy.hostname }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "opsiforce-proxy.fullname" . }}-external-services
  labels:
    {{- include "opsiforce-proxy.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "*.{{ .Values.externalServiceProxy.hostname }}"
    external-dns.alpha.kubernetes.io/target: {{ .Values.ingressRoute.traefikTarget }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`[a-z0-9-]+\.{{ .Values.externalServiceProxy.hostname | replace "." "\\." }}`)
      kind: Rule
      services:
        - name: {{ .Values.externalServiceProxy.backendService }}
          port: {{ .Values.externalServiceProxy.backendPort }}
  {{- if .Values.ingressRoute.certResolver }}
  tls:
    certResolver: {{ .Values.ingressRoute.certResolver }}
    domains:
      - main: "*.{{ .Values.externalServiceProxy.hostname }}"
  {{- end }}
{{- end }}
