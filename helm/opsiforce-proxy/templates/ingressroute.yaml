{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "opsiforce-proxy.fullname" . }}
  labels:
    {{- include "opsiforce-proxy.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingressRoute.hostname }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.ingressRoute.traefikTarget }}
spec:
  entryPoints:
    - websecure
  routes:
    {{- if .Values.externalServiceProxy.backendService }}
    - match: Host(`{{ .Values.ingressRoute.hostname }}`) && PathPrefix(`/api/external-services/webhooks/`)
      kind: Rule
      services:
        - name: {{ .Values.externalServiceProxy.backendService }}
          port: {{ .Values.externalServiceProxy.webhookPort }}
    {{- end }}
    - match: Host(`{{ .Values.ingressRoute.hostname }}`)
      kind: Rule
      services:
        - name: {{ include "opsiforce-proxy.fullname" . }}
          port: {{ include "opsiforce-proxy.proxyPort" . }}
  {{- if .Values.ingressRoute.certResolver }}
  tls:
    certResolver: {{ .Values.ingressRoute.certResolver }}
  {{- end }}
{{- end }}