replicaCount: 1

auth:
  mode: oidc
  static:
    userId: 00000000-0000-4000-8000-000000000001
    preferredUsername: test
    email: test@opsiforce.local
    tenantName: local
    permissions: []

keycloakMs:
  enabled: true

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

proxy:
  agentService:
  backendService:
  frontendService:
  keycloakMsApiBackend:
  keycloakMsAssetsBackend:

oauth2Proxy:
  image:
  provider: keycloak-oidc
  emailClaim: preferred_username
  clientId:
  clientSecret: ""
  cookieSecret:
  cookieSecure: false
  cookieDomain:
  cookieName:
  issuerUrl:
  logoutUrl:
  redirectUrl:
  redisPath:
  extraArgs: []
  credentialsSecret: ""

imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

ingressRoute:
  enabled: true
  hostname: ""
  traefikTarget: ""
  certResolver: letsencrypt

appProxy:
  backendService: ""
  backendPort: "3002"
  appsHostname: ""
  previewAppsHostname: ""

vscodeProxy:
  backendService: ""
  appsHostname: ""

dbProxy:
  backendService: ""
  appsHostname: ""

externalServiceProxy:
  backendService: ""
  backendPort: "3006"
  webhookPort: "3008"
  hostname: ""

bifrostDashboard:
  enabled: true
  serviceName: ""
  hostname: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cfke.io/region
              operator: In
              values:
                - northamerica
            - key: cfke.io/subregion
              operator: In
              values:
                - east
            - key: node.kubernetes.io/instance-type
              operator: NotIn
              values:
                - cpx11
                - cpx21
                - cpx22
                - cpx32
                - ccx13
                - cx23
                - cx33
