replicaCount: 1

auth:
  mode: oidc
  static:
    userId: 00000000-0000-4000-8000-000000000001
    preferredUsername: test
    email: test@opsiforce.local
    tenantName: local
    permissions:
      - can_manage_project_budget_settings
      - can_manage_project_timeout_settings
      - can_manage_project_logging_settings
      - can_manage_project_auth_settings
      - can_manage_project_pod_settings
      - can_manage_tenant_budget
      - can_view_code_tab
      - can_view_db_tab
      - can_disable_project
      - can_restart_project
      - can_duplicate_project
      - can_delete_project
      - can_export_project
      - can_import_project
      - can_view_queue_dashboard
      - can_manage_workspaces
      - can_move_projects_between_workspaces
      - can_edit_app_details
      - can_manage_environments
      - can_manage_environment_variables
      - can_publish_project
      - can_delete_environment
      - can_manage_schedules
      - can_view_pods
      - can_manage_platform_defaults
      - can_manage_tenant_defaults
      - can_manage_external_integration
      - can_manage_external_services
      - can_view_external_services_usage
      - can_view_platform_storage
      - can_manage_platform_storage
      - can_use_public_api

keycloakMs:
  enabled: true

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

proxy:
  agentService:
  backendService:
  frontendService:
  keycloakMsApiBackend:
  keycloakMsAssetsBackend:

oauth2Proxy:
  image:
  provider: keycloak-oidc
  emailClaim: preferred_username
  clientId:
  cookieSecret:
  cookieDomain:
  cookieName:
  clientSecret:
  issuerUrl:
  logoutUrl:
  redirectUrl:
  redisPath:
  extraArgs: []
  credentialsSecret: ""

imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

ingressRoute:
  enabled: true
  hostname: ""
  traefikTarget: ""
  certResolver: letsencrypt

appProxy:
  backendService: ""
  backendPort: "3002"
  appsHostname: ""
  previewAppsHostname: ""

vscodeProxy:
  backendService: ""
  appsHostname: ""

dbProxy:
  backendService: ""
  appsHostname: ""

bifrostDashboard:
  enabled: true
  serviceName: ""
  hostname: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cfke.io/region
              operator: In
              values:
                - northamerica
            - key: cfke.io/subregion
              operator: In
              values:
                - east
            - key: node.kubernetes.io/instance-type
              operator: NotIn
              values:
                - cpx11
                - cpx21
                - cpx22
                - cpx32
                - ccx13
                - cx23
                - cx33
