apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsiforce-backend.fullname" . }}-config
  labels:
    {{- include "opsiforce-backend.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  K8S_NAMESPACE: {{ .Values.config.k8sNamespace | quote }}
  {{- if ne (toString .Values.config.poolSizeOverride) "" }}
  POOL_SIZE_OVERRIDE: {{ .Values.config.poolSizeOverride | quote }}
  {{- end }}
  {{- if .Values.config.agentContainerImage }}
  AGENT_CONTAINER_IMAGE: {{ .Values.config.agentContainerImage | quote }}
  {{- end }}
  AGENT_CONTAINER_IMAGE_PULL_POLICY: {{ .Values.config.agentContainerImagePullPolicy | quote }}
  AGENT_PORT: {{ .Values.config.agentPort | quote }}
  VSCODE_PORT: {{ .Values.config.vscodePort | quote }}
  DB_VIEWER_PORT: {{ .Values.config.dbViewerPort | default "8081" | quote }}
  CEPHFS_PVC_NAME: {{ .Values.config.cephfsPvcName | quote }}
  STORAGE_TYPE: {{ .Values.config.storageType | quote }}
  STORAGE_MOUNT_PATH: {{ .Values.config.storageMountPath | default "/workspace-data" | quote }}
  STORAGE_CLAIM_SIZE: {{ .Values.config.storageClaimSize | default "" | quote }}
  AGENT_WORKSPACE_UPDATE_ON_STARTUP: {{ .Values.config.agentWorkspaceUpdateOnStartup | default "true" | quote }}
  AGENT_UPDATE_JOB_TIMEOUT_MS: {{ .Values.config.agentUpdateJobTimeoutMs | default "1800000" | quote }}
  {{- if .Values.config.agentNodeSelector }}
  AGENT_NODE_SELECTOR: {{ .Values.config.agentNodeSelector | toJson | quote }}
  {{- end }}
  {{- if .Values.config.agentTolerations }}
  AGENT_TOLERATIONS: {{ .Values.config.agentTolerations | toJson | quote }}
  {{- end }}
  {{- if .Values.config.agentAffinity }}
  AGENT_AFFINITY: {{ .Values.config.agentAffinity | toJson | quote }}
  {{- end }}
  {{- if .Values.imagePullSecrets }}
  IMAGE_PULL_SECRETS: {{ .Values.imagePullSecrets | toJson | quote }}
  {{- end }}
  {{- if .Values.config.gotenbergUrl }}
  GOTENBERG_URL: {{ .Values.config.gotenbergUrl | quote }}
  {{- end }}
  {{- if .Values.config.bifrostProxyUrl }}
  BIFROST_PROXY_URL: {{ .Values.config.bifrostProxyUrl | quote }}
  {{- end }}
  {{- if .Values.config.bifrostPodProxyUrl }}
  BIFROST_POD_PROXY_URL: {{ .Values.config.bifrostPodProxyUrl | quote }}
  {{- end }}
  {{- if .Values.config.gatewayUrl }}
  SERVICE_GATEWAY_URL: {{ .Values.config.gatewayUrl | quote }}
  {{- end }}
  {{- if .Values.config.platformApiUrl }}
  OPSIFORCE_API_URL: {{ .Values.config.platformApiUrl | quote }}
  {{- end }}
  {{- if .Values.config.runtimeProxyUrl }}
  OPSIFORCE_RUNTIME_PROXY_URL: {{ .Values.config.runtimeProxyUrl | quote }}
  {{- end }}
  {{- if .Values.config.externalServicesUrl }}
  EXTERNAL_SERVICES_URL: {{ .Values.config.externalServicesUrl | quote }}
  {{- end }}
  {{- if .Values.config.mailgunDomain }}
  MAILGUN_DOMAIN: {{ .Values.config.mailgunDomain | quote }}
  {{- end }}
  {{- if .Values.config.mailgunReceiveDomain }}
  MAILGUN_RECEIVE_DOMAIN: {{ .Values.config.mailgunReceiveDomain | quote }}
  {{- end }}
  {{- if .Values.config.mailgunUrl }}
  MAILGUN_URL: {{ .Values.config.mailgunUrl | quote }}
  {{- end }}
  {{- if .Values.config.mailgunSender }}
  MAILGUN_SENDER: {{ .Values.config.mailgunSender | quote }}
  {{- end }}
  {{- if .Values.config.whapiApiUrl }}
  WHAPI_API_URL: {{ .Values.config.whapiApiUrl | quote }}
  {{- end }}
  {{- if .Values.config.externalServicesWebhookBaseUrl }}
  EXTERNAL_SERVICES_WEBHOOK_BASE_URL: {{ .Values.config.externalServicesWebhookBaseUrl | quote }}
  {{- end }}
  {{- if .Values.config.appsHostname }}
  APPS_HOSTNAME: {{ .Values.config.appsHostname | quote }}
  {{- end }}
  {{- if .Values.config.webappServiceName }}
  WEBAPP_SERVICE_NAME: {{ .Values.config.webappServiceName | quote }}
  {{- end }}
  {{- if .Values.config.webappServicePort }}
  WEBAPP_SERVICE_PORT: {{ .Values.config.webappServicePort | quote }}
  {{- end }}
  {{- if .Values.config.managedOidcClientId }}
  MANAGED_OIDC_CLIENT_ID: {{ .Values.config.managedOidcClientId | quote }}
  {{- end }}
  {{- if .Values.config.managedOidcIssuerUrl }}
  MANAGED_OIDC_ISSUER_URL: {{ .Values.config.managedOidcIssuerUrl | quote }}
  {{- end }}
  {{- if .Values.config.managedTenantRolePrefix }}
  MANAGED_TENANT_ROLE_PREFIX: {{ .Values.config.managedTenantRolePrefix | quote }}
  {{- end }}
  {{- if .Values.config.ssoGroupMap }}
  SSO_GROUP_MAP: {{ .Values.config.ssoGroupMap | quote }}
  {{- end }}
  {{- if .Values.config.defaultTenantName }}
  DEFAULT_TENANT_NAME: {{ .Values.config.defaultTenantName | quote }}
  {{- end }}
