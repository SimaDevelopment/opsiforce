apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsiforce-backend.fullname" . }}-secret
  labels:
    {{- include "opsiforce-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.config.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.config.anthropicApiKey | quote }}
  BIFROST_ADMIN_USERNAME: {{ .Values.config.bifrostAdminUsername | quote }}
  BIFROST_ADMIN_PASSWORD: {{ .Values.config.bifrostAdminPassword | quote }}
  {{- /* TODO: remove in the release after External Services v2 ships: MAILGUN_API_KEY and MAILGUN_WEBHOOK_SIGNING_KEY */}}
  MAILGUN_API_KEY: {{ .Values.config.mailgunApiKey | quote }}
  MAILGUN_WEBHOOK_SIGNING_KEY: {{ .Values.config.mailgunWebhookSigningKey | quote }}
  EXTERNAL_SERVICES_ENCRYPTION_KEY: {{ required "config.externalServicesEncryptionKey is required; generate one with: openssl rand -hex 32" .Values.config.externalServicesEncryptionKey | quote }}
  PROXY_CONTROL_TOKEN: {{ .Values.config.proxyControlToken | quote }}
  APP_AUTH_FORWARDING_SIGNING_KEY: {{ .Values.config.appAuthForwardingSigningKey | quote }}
  LINKED_ACCOUNT_PROXY_SERVICE_TOKEN: {{ .Values.config.linkedAccountProxyServiceToken | quote }}
  OIDC_PLUGIN_SECRET: {{ .Values.config.oidcPluginSecret | quote }}
  MANAGED_OIDC_CLIENT_SECRET: {{ .Values.config.managedOidcClientSecret | quote }}
