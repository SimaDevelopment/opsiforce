replicaCount: 1
terminationGracePeriodSeconds: 45

fullnameOverride: opsiforce-backend
npmMigrationJob: false

backend:
  image:
    repository: opsiforce-backend
    tag: dev
    pullPolicy: Never
  containerPort: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256M

imagePullSecrets: []

serviceAccountName: opsiforce-agent

config:
  databaseUrl: "postgres://admin:dbpass1@local-pg-postgresql:5432/opsiforce"
  redisUrl: "redis://redis-session-storage-local-master:6379/2"
  k8sNamespace: "local"
  poolSizeOverride: "0"
  agentContainerImage: ""
  agentContainerImagePullPolicy: "Never"
  agentPort: "4096"
  vscodePort: "8080"
  dbViewerPort: "8081"
  cephfsPvcName: "opsiforce-data"
  storageType: "hostPath"
  storageMountPath: "/workspace-data"
  storageClaimSize: ""
  proxyControlToken: "opsiforce-local-proxy-token"
  agentWorkspaceUpdateOnStartup: "true"
  agentUpdateJobTimeoutMs: "1800000"
  agentNodeSelector: ~
  agentTolerations: ~
  agentAffinity: ~
  bifrostProxyUrl: "http://opsiforce-bifrost:8080/v1"
  bifrostPodProxyUrl: "http://opsiforce-bifrost:8080/v1"
  bifrostAdminUsername: "opsiforce-admin"
  bifrostAdminPassword: "opsiforce-local-admin"
  gatewayUrl: "http://opsiforce-backend:3001/api/gateway"
  platformApiUrl: "http://opsiforce-backend:3001/api/v1"
  runtimeProxyUrl: "http://proxy-agent:3005"
  externalServicesUrl: "http://opsiforce-backend:3001/api/external-services/agent"
  mailgunApiKey: "key-example"
  mailgunDomain: "sima"
  mailgunReceiveDomain: ""
  mailgunWebhookSigningKey: "local-mailgun-signing-key"
  mailgunSender: "local@sima-local"
  mailgunUrl: "http://host.minikube.internal:8089"
  whapiApiUrl: "https://gate.whapi.cloud"
  externalServicesWebhookBaseUrl: ""
  externalServicesEncryptionKey: "9a1f6be6b5265eab6ad743b81d652f2a19f6dd94dd4b8a0dbb8788e723e35d40"
  appsHostname: "apps.opsiforce.localtest.me"
  webappServiceName: "proxy-app"
  webappServicePort: "3002"
  oidcPluginSecret: "1198c2e7c224237098895d53543b074c"
  managedOidcClientId: "opsiforce-apps"
  managedOidcClientSecret: "a037227dd1c2aee75f1056ad6ab3c088"
  managedOidcIssuerUrl: "http://sima-keycloak-local-service:8086/realms/sima"
  managedTenantRolePrefix: "makara_tenant_name_"

affinity: ~
nodeSelector: {}
tolerations: []

startupProbe:
  httpGet:
    path: /api/health
    port: 3001
  failureThreshold: 60
  periodSeconds: 5
