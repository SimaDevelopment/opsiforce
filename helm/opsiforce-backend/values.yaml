replicaCount: 1

npmMigrationJob: true

backend:
  image:
    repository: ""
    tag: backend
    pullPolicy: Always
  containerPort: 3001
  resources:
    requests:
      cpu: 50m
      memory: 300M

serviceAccountName: ""

config:
  databaseUrl: ""
  redisUrl: ""
  k8sNamespace: ""
  poolSizeOverride: ""
  agentContainerImage: ""
  agentContainerImagePullPolicy: "Always"
  agentPort: "4096"
  vscodePort: "8080"
  dbViewerPort: "8081"
  cephfsPvcName: "opsiforce-cephfs"
  storageType: "cephfs"
  storageMountPath: "/workspace-data"
  storageClaimSize: "300Gi"
  proxyControlToken: ""
  appAuthForwardingSigningKey: ""
  linkedAccountProxyServiceToken: ""
  agentWorkspaceUpdateOnStartup: "true"
  agentUpdateJobTimeoutMs: "1800000"
  agentNodeSelector: {}
  agentTolerations: []
  openaiApiKey: ""
  anthropicApiKey: ""
  gotenbergUrl: ""
  bifrostProxyUrl: ""
  bifrostPodProxyUrl: ""
  bifrostAdminUsername: ""
  bifrostAdminPassword: ""
  bifrostUpstreamProvider: ""
  bifrostFallbackProvider: ""
  gatewayUrl: ""
  runtimeProxyUrl: ""
  externalServicesHost: ""
  externalServiceProxyControl: ""
  podCaBundleConfigMap: ""
  # Days a Call log row is kept; empty = the backend default (30). Usage counters are kept forever.
  externalServiceCallLogRetentionDays: ""
  # TODO: remove in the release after External Services v2 ships: every mailgun* key and whapiApiUrl (dead /api/gateway email provider + one-time v1 importers)
  mailgunApiKey: ""
  mailgunDomain: ""
  mailgunReceiveDomain: ""
  mailgunWebhookSigningKey: ""
  mailgunSender: ""
  whapiApiUrl: ""
  opsiforcePublicUrl: ""
  externalServicesEncryptionKey: ""
  appsHostname: ""
  webappServiceName: ""
  webappServicePort: "3002"
  oidcPluginSecret: ""
  managedOidcClientId: ""
  managedOidcClientSecret: ""
  managedOidcIssuerUrl: ""
  managedTenantRolePrefix: ""
  ssoGroupMap: ""
  defaultTenantName: ""
  # Empty uses the cluster default runtime (Azure and local development).
  # The regular deployment workflow explicitly selects the Kata RuntimeClass.
  agentRuntimeClassName: ""
  agentPrivileged: false
  agentAffinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cfke.io/region
                operator: In
                values:
                  - northamerica
              - key: cfke.io/subregion
                operator: In
                values:
                  - east
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values:
                  - cpx11
                  - cpx21
                  - cpx22
                  - cpx32
                  - ccx13
                  - cx23
                  - cx33

imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

resources: {}

livenessProbe:
  httpGet:
    path: /api/health
    port: http
readinessProbe:
  httpGet:
    path: /api/health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cfke.io/region
              operator: In
              values:
                - northamerica
            - key: cfke.io/subregion
              operator: In
              values:
                - east
            - key: node.kubernetes.io/instance-type
              operator: NotIn
              values:
                - cpx11
                - cpx21
                - cpx22
                - cpx32
                - ccx13
                - cx23
                - cx33
