replicaCount: 1

npmMigrationJob: true

backend:
  image:
    repository: ""
    tag: backend
    pullPolicy: Always
  containerPort: 3001
  resources:
    requests:
      cpu: 50m
      memory: 300M

serviceAccountName: ""

config:
  databaseUrl: ""
  redisUrl: ""
  k8sNamespace: ""
  poolSizeOverride: ""
  agentContainerImage: ""
  agentContainerImagePullPolicy: "Always"
  agentPort: "4096"
  vscodePort: "8080"
  dbViewerPort: "8081"
  cephfsPvcName: "opsiforce-cephfs"
  storageType: "cephfs"
  storageMountPath: "/workspace-data"
  storageClaimSize: "300Gi"
  proxyControlToken: ""
  agentWorkspaceUpdateOnStartup: "true"
  agentUpdateJobTimeoutMs: "1800000"
  agentNodeSelector: {}
  agentTolerations: []
  openaiApiKey: ""
  gotenbergUrl: ""
  bifrostProxyUrl: ""
  bifrostPodProxyUrl: ""
  bifrostAdminUsername: ""
  bifrostAdminPassword: ""
  gatewayUrl: ""
  platformApiUrl: ""
  runtimeProxyUrl: ""
  externalServicesUrl: ""
  mailgunApiKey: ""
  mailgunDomain: ""
  mailgunReceiveDomain: ""
  mailgunWebhookSigningKey: ""
  mailgunSender: ""
  whapiApiUrl: ""
  externalServicesWebhookBaseUrl: ""
  externalServicesEncryptionKey: ""
  appsHostname: ""
  webappServiceName: ""
  webappServicePort: "3002"
  oidcPluginSecret: ""
  managedOidcClientId: ""
  managedOidcClientSecret: ""
  managedOidcIssuerUrl: ""
  managedTenantRolePrefix: ""
  ssoGroupMap: ""
  defaultTenantName: ""
  agentAffinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cfke.io/region
                operator: In
                values:
                  - northamerica
              - key: cfke.io/subregion
                operator: In
                values:
                  - east
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values:
                  - cpx11
                  - cpx21
                  - cpx22
                  - cpx32
                  - ccx13
                  - cx23
                  - cx33

imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

resources: {}

livenessProbe:
  httpGet:
    path: /api/health
    port: http
readinessProbe:
  httpGet:
    path: /api/health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cfke.io/region
              operator: In
              values:
                - northamerica
            - key: cfke.io/subregion
              operator: In
              values:
                - east
            - key: node.kubernetes.io/instance-type
              operator: NotIn
              values:
                - cpx11
                - cpx21
                - cpx22
                - cpx32
                - ccx13
                - cx23
                - cx33
