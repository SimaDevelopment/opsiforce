service:
  type: ClusterIP

fullnameOverride: opsiforce-bifrost

image:
  tag: "v2.0.0"

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 4Gi
  limits:
    cpu: 2000m
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

storage:
  mode: postgres
  configStore:
    enabled: true
  logsStore:
    enabled: true

vectorStore:
  enabled: false
  type: none

postgresql:
  enabled: false
  external:
    enabled: true
    host: postgres-cluster-pooler-pooler-rw.postgres.svc.cluster.local
    port: 5432
    user: postgres
    database: bifrost
    sslMode: disable
    existingSecret: opsiforce-bifrost-postgres
    passwordKey: password

bifrost:
  sourceOfTruth: "config.json"
  encryptionKeySecret:
    name: opsiforce-bifrost-encryption
    key: key
  authConfig:
    isEnabled: true
    existingSecret: opsiforce-bifrost-admin-auth
    usernameKey: username
    passwordKey: password
  client:
    dropExcessRequests: true
    enableLogging: true
    logRetentionDays: 7
    allowDirectKeys: false
    enforceAuthOnInference: true
  providers:
    azure:
      keys:
        - name: azure-foundry
          value: env.AZURE_FOUNDRY_API_KEY
          weight: 1
          models:
            - gpt-5.6-sol
          azure_key_config:
            endpoint: env.AZURE_FOUNDRY_ENDPOINT
  providerSecrets:
    azure-api-key:
      existingSecret: opsiforce-bifrost-provider-keys
      key: azure-api-key
      envVar: AZURE_FOUNDRY_API_KEY
    azure-endpoint:
      existingSecret: opsiforce-bifrost-provider-keys
      key: azure-endpoint
      envVar: AZURE_FOUNDRY_ENDPOINT
  plugins:
    governance:
      enabled: true
    logging:
      enabled: true
