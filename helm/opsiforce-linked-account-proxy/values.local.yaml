image:
  repository: opsiforce-linked-account-proxy
  tag: dev
  pullPolicy: Never

serviceToken: "opsiforce-local-linked-account-proxy-token"

terminationGracePeriodSeconds: 30

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
