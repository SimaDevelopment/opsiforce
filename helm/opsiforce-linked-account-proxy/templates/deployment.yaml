apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsiforce-linked-account-proxy.fullname" . }}
  labels:
    app: {{ include "opsiforce-linked-account-proxy.fullname" . }}
    {{- include "opsiforce-linked-account-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "opsiforce-linked-account-proxy.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: {{ include "opsiforce-linked-account-proxy.fullname" . }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: linked-account-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: LINKED_ACCOUNT_PROXY_BACKEND_URL
              value: {{ .Values.config.backendUrl | quote }}
            - name: LINKED_ACCOUNT_PROXY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsiforce-linked-account-proxy.secretName" . }}
                  key: LINKED_ACCOUNT_PROXY_SERVICE_TOKEN
          ports:
            - name: http
              containerPort: 8455
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
