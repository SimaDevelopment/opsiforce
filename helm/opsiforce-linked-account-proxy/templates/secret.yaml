{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsiforce-linked-account-proxy.secretName" . }}
  labels:
    {{- include "opsiforce-linked-account-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  LINKED_ACCOUNT_PROXY_SERVICE_TOKEN: {{ required "serviceToken or existingSecret is required" .Values.serviceToken | quote }}
{{- end }}
