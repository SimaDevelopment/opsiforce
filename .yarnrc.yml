yarnPath: .yarn/releases/yarn-4.17.0.cjs

nodeLinker: pnp

enableScripts: true

approvedGitRepositories:
  - "https://github.com/anomalyco/ghostty-web.git"

packageExtensions:
  "@tanstack/router-devtools-core@*":
    dependencies:
      "@tanstack/router-core": "*"
  drizzle-kit@*:
    peerDependencies:
      drizzle-orm: "*"
  "@bull-board/api@*":
    peerDependencies:
      bullmq: "*"
    dependencies:
      "@bull-board/ui": "9.9.0"
