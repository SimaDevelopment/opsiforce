yarnPath: .yarn/releases/yarn-4.17.0.cjs

nodeLinker: pnp

enableScripts: true

approvedGitRepositories:
  - "https://github.com/anomalyco/ghostty-web.git"

packageExtensions:
  "@tanstack/router-devtools-core@*":
    dependencies:
      "@tanstack/router-core": "*"
  "@pierre/diffs@*":
    dependencies:
      "@shikijs/themes": ^3.0.0 || ^4.0.0
  drizzle-kit@*:
    peerDependencies:
      drizzle-orm: "*"
  "@bull-board/api@*":
    peerDependencies:
      bullmq: "*"
    dependencies:
      "@bull-board/ui": "9.9.0"
