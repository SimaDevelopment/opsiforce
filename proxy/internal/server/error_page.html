<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>{{.Title}}</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #09090b;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 22rem;
        text-align: center;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        margin-bottom: 16px;
        border-radius: 10px;
        background: #f4f4f5;
        color: #71717a;
      }
      .icon svg {
        width: 20px;
        height: 20px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #71717a;
        font-size: 13px;
      }
      .status {
        min-height: 18px;
        margin-top: 12px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .retry {
        display: inline-flex;
        align-items: center;
        height: 32px;
        margin-top: 12px;
        padding: 0 12px;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        color: #09090b;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
      }
      .retry:hover {
        background: #f4f4f5;
      }
      .retry:focus-visible {
        outline: 2px solid #18181b;
        outline-offset: 2px;
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg
          {{- if eq .Icon "starting"}} class="spin"{{end}}
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          {{- if eq .Icon "starting"}}
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          {{- else if eq .Icon "unresponsive"}}
          <path d="m19 5 3-3" />
          <path d="m2 22 3-3" />
          <path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z" />
          <path d="M7.5 13.5 10 11" />
          <path d="M10.5 16.5 13 14" />
          <path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z" />
          {{- else if eq .Icon "failed"}}
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
          {{- else if eq .Icon "off"}}
          <path d="M12 2v10" />
          <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />
          {{- else}}
          <path d="m13.5 8.5-5 5" />
          <path d="m8.5 8.5 5 5" />
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
          {{- end}}
        </svg>
      </div>
      <h1>{{.Title}}</h1>
      <p>{{.Detail}}</p>
      {{- if .CheckAfter}}
      <p class="status" id="status"></p>
      <a class="retry" id="retry" href="">Try again</a>
      <script>
        (() => {
          const status = document.getElementById("status");
          const giveUpAt = Date.now() + {{.CheckForSeconds}} * 1000;
          let delay = {{.CheckAfter}};

          document.getElementById("retry").addEventListener("click", (event) => {
            event.preventDefault();
            location.reload();
          });

          const stillRefused = (response) => response.status >= 500;

          const check = async () => {
            status.textContent = "Checking…";
            try {
              const response = await fetch(location.href, {
                cache: "no-store",
                redirect: "manual",
                signal: AbortSignal.timeout(10000),
              });
              if (!stillRefused(response)) {
                location.reload();
                return;
              }
            } catch {}
            delay = Math.min(delay * 2, 30);
            wait(delay);
          };

          const wait = (seconds) => {
            if (Date.now() + seconds * 1000 > giveUpAt) {
              status.textContent = "Stopped checking. Try again once it's back.";
              return;
            }
            let left = seconds;
            const tick = () => {
              if (left === 0) {
                check();
                return;
              }
              status.textContent = "Checking again in " + left + "s";
              left -= 1;
              setTimeout(tick, 1000);
            };
            tick();
          };

          wait(delay);
        })();
      </script>
      {{- end}}
    </main>
  </body>
</html>
